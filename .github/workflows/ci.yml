name: CI

# design.md §9: ArchUnit のルールはテストが実行されて初めて強制力を持つ。
# ローカル実行に委ねると「テストを流さなければ違反したままコミットできる」状態が残るため、
# push と pull request のたびに必ず走らせる。
on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへ続けて push したとき、古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN に与える権限を明示的に絞る。宣言しないとリポジトリ既定に従うため、
# 設定次第では書き込み可能なトークンがテスト実行に渡る。ここはテストを流すだけで、
# リポジトリへ書き戻す操作が一切ない。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # 結合テストの多くが実DBを必要とする。H2等への差し替えはしない。
    # FOR UPDATE SKIP LOCKED や ON CONFLICT DO NOTHING に依存しており、
    # 別のDBで通っても PostgreSQL で通る保証にならないため(design.md §9)。
    services:
      postgres:
        image: postgres:17
        # テスト専用DB(design.md §9.1)。ここではアプリを起動しないため競合は起きないが、
        # ローカルと同じ綴りにしておく。接続先は surefire が固定するので、
        # 環境変数(SPRING_DATASOURCE_*)はここでは渡さない。渡しても上書きされる。
        env:
          POSTGRES_DB: settlement_test
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d settlement_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # テストの接続先は pom.xml の ci プロファイルが決める。GitHub Actions が
      # 立てる CI=true で有効になり、localhost:5432 の settlement_test を向く。
      - name: Build and test
        run: ./mvnw -B verify

      # 失敗時に原因を追えるよう、レポートを残す。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
