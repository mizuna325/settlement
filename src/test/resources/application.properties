# テスト用の設定。
# クラスパス上で src/main/resources/application.properties を「置き換える」(マージではない)ため、
# 本番側の値もここに書き写す必要がある。片方だけ変更すると気づきにくいので注意。
spring.application.name=settlement

settlement.psp.base-url=http://localhost:8080
settlement.psp.connect-timeout=3s
settlement.psp.read-timeout=5s

settlement.psp.dispatch.polling-interval=1s
settlement.psp.dispatch.max-attempts=5
settlement.psp.dispatch.backoff-base=1s
settlement.psp.dispatch.claim-timeout=1m
settlement.psp.dispatch.batch-size=10

# Relay は既定で止めておく。動かすテストだけが
# @SpringBootTest(properties = "settlement.psp.dispatch.enabled=true") で有効化する。
# 常時動かすと、別スレッドの走査が他のテストのデータを拾って非決定的になる。
settlement.psp.dispatch.enabled=false
